{n:'天空の城',sky:['#0e3a6a','#9ae0ff'],far:'#5a8ac0',mid:'#3d6aa0',tile:'#5a6a8a',top:'#cfe8ff'}];

function updP(dt){const p=pl,dir=(K.r?1:0)-(K.l?1:0);p.inv-=dt;p.dcd-=dt;p.atk-=dt;p.cT-=dt;p.coy=p.gr?.1:p.coy-dt;p.buf-=dt;if(P.j)p.buf=.12;if(dir&&p.atk<.1)p.face=dir;

else{p.vx+=(dir*250-p.vx)*Math.min(1,(p.gr?18:10)*dt);p.vy=Math.min(p.vy+(K.j||p.vy>0?1800:3200)*dt,900)}
if(p.buf>0){if(p.coy>0){p.vy=-640;p.coy=0;p.buf=0;p.jumps=0;snd(300,.12,'square',300);burst(p.x+10,p.y+30,5,'#ccd',80,.3)}else if(P.j&&p.jumps<1){p.vy=-560;p.jumps++;p.buf=0;snd(420,.12,'square',300);burst(p.x+10,p.y+30,8,'#8cf',120,.3)}}

function update(dt){

function world(){const th=TH[st],i0=Math.max(0,cam.x/T|0),i1=Math.min(LW-1,(cam.x+W)/T+1|0);
for(let i=i0;i<=i1;i++)for(let j=0;j<R;j++){const v=G[j][i],x=i*T,y=j*T;
if(v==1){g.fillStyle=th.tile;g.fillRect(x,y,T,T);if((i*7+j*13)%5==0){g.fillStyle='rgba(255,255,255,.07)';g.fillRect(x+4,y+6,12,8)}
if(j==0||G[j-1][i]!=1){g.fillStyle=th.top;g.fillRect(x,y,T,7);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(x,y+7,T,3)}else if(j>0&&G[j-1][i]==1&&(j==R-1||(i*j)%3==0)){g.fillStyle='rgba(0,0,0,.12)';g.fillRect(x,y,T,T)}}
else if(v==2){g.fillStyle=th.top;g.fillRect(x,y,T,8);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x,y+8,T,3)}
else if(v==3){g.fillStyle='#c8cfe0';for(let s=0;s<2;s++){g.beginPath();g.moveTo(x+s*16,y+T);g.lineTo(x+s*16+8,y+14);g.lineTo(x+s*16+16,y+T);g.fill()}}}
CP.forEach((c,i)=>{g.fillStyle='#ccd';g.fillRect(c.x,c.y-48,3,48);g.fillStyle=CP.indexOf(CP.cur)>=i?'#4f8':'#789';g.beginPath();g.moveTo(c.x+3,c.y-48);g.lineTo(c.x+26,c.y-40+Math.sin(t*5)*2);g.lineTo(c.x+3,c.y-32);g.fill()});
if(exit){const gr=g.createRadialGradient(exit.x+20,exit.y+35,4,exit.x+20,exit.y+35,50);gr.addColorStop(0,'#fff');gr.addColorStop(.4,'#8cf');gr.addColorStop(1,'rgba(150,80,255,0)');g.fillStyle=gr;g.beginPath();g.ellipse(exit.x+20,exit.y+35,26+Math.sin(t*4)*4,50,0,0,7);g.fill()}
for(const it of I){if(it.t){g.fillStyle='#f55';g.font='20px '+F;g.textAlign='center';g.fillText('♥',it.x,it.y+8+Math.sin(t*3+it.x)*3)}else{g.fillStyle='#fd4';g.beginPath();g.ellipse(it.x,it.y,Math.abs(Math.cos(t*4+it.x*.1))*7+1,8,0,0,7);g.fill();g.strokeStyle='#a60';g.lineWidth=1.5;g.stroke()}}
for(const q of AP){g.globalAlpha=Math.sin(q.l/q.m*3.14)*.8;g.fillStyle=st==1?'#fa5':st==2?'#fff':'#dfa';g.fillRect(q.x,q.y,st==0?3:2,st==0?3:2)}g.globalAlpha=1;
E.forEach(drawE);
for(const b of B){g.fillStyle='#f4a';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(b.x,b.y,b.r/2,0,7);g.fill()}
drawP();
for(const q of Pt){g.globalAlpha=Math.max(0,q.l/q.m);g.fillStyle=q.c;g.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s)}g.globalAlpha=1}
function drawE(e){const cx=e.x+e.w/2,cy=e.y+e.h,c=o=>e.fl>0?'#fff':o,d=e.dir||1;g.save();
if(e.t=='slime'){const w=Math.sin(e.tm*6)*2;g.fillStyle=c('#5ad46a');g.beginPath();g.ellipse(cx,cy,15+w,20-w,0,Math.PI,0);g.fill();eye(cx+d*4-5,cy-11);eye(cx+d*4+5,cy-11)}
else if(e.t=='knight'){g.fillStyle=c('#8a93a6');g.fillRect(e.x+2,e.y+12,22,24);g.fillStyle=c('#aab2c4');g.fillRect(e.x+3,e.y,20,14);g.fillStyle='#e33';g.fillRect(cx-2,e.y-6,4,8);g.fillStyle='#111';g.fillRect(cx+(d>0?1:-9),e.y+5,8,3);g.strokeStyle='#dde';g.lineWidth=3;g.beginPath();g.moveTo(cx+d*8,cy-14);g.lineTo(cx+d*24,cy-26-Math.sin(e.tm*8)*4);g.stroke()}
else if(e.t=='turret'){g.fillStyle=c('#6b6f80');g.fillRect(e.x,e.y+8,30,20);g.fillStyle=c('#858aa0');g.fillRect(e.x+3,e.y,24,10);const a=Math.atan2(pl.y-e.y,pl.x-e.x);g.strokeStyle='#333';g.lineWidth=7;g.beginPath();g.moveTo(cx,e.y+8);g.lineTo(cx+Math.cos(a)*18,e.y+8+Math.sin(a)*18);g.stroke();g.fillStyle='#f55';g.fillRect(cx-3,e.y+16,6,4)}
else if(e.t=='bat'){const f=Math.sin(e.tm*14)*8;g.fillStyle=c('#7a4aa8');g.beginPath();g.moveTo(cx,cy-8);g.lineTo(cx-26,cy-8-f);g.lineTo(cx-8,cy-2);g.moveTo(cx,cy-8);g.lineTo(cx+26,cy-8-f);g.lineTo(cx+8,cy-2);g.fill();g.beginPath();g.ellipse(cx,cy-8,9,8,0,0,7);g.fill();g.fillStyle='#ff4';g.fillRect(cx-5,cy-11,3,3);g.fillRect(cx+2,cy-11,3,3)}
else{const en=e.hp<e.m/2;if(e.s==1&&e.a>1&&(t*20|0)%2){g.strokeStyle='#f33';g.lineWidth=3;g.strokeRect(e.x-4,e.y-4,e.w+8,e.h+8)}
g.fillStyle=c(en?'#b02848':'#7a1830');g.fillRect(e.x,e.y+16,e.w,e.h-16);g.beginPath();g.ellipse(cx,e.y+24,34,26,0,0,7);g.fill();
g.fillStyle=c('#e8d9b0');g.beginPath();g.moveTo(e.x+6,e.y+10);g.lineTo(e.x-4,e.y-14);g.lineTo(e.x+20,e.y+4);g.moveTo(e.x+e.w-6,e.y+10);g.lineTo(e.x+e.w+4,e.y-14);g.lineTo(e.x+e.w-20,e.y+4);g.fill();
g.fillStyle='#fe4';g.fillRect(cx+d*10-12,e.y+20,10,6);g.fillRect(cx+d*10+4,e.y+20,10,6);g.fillStyle='#200';g.fillRect(cx-16+d*4,e.y+42,32,8);g.fillStyle='#fff';for(let i=0;i<5;i++)g.fillRect(cx-14+d*4+i*7,e.y+42,4,5)}
g.restore()}
function eye(x,y){g.fillStyle='#fff';g.beginPath();g.arc(x,y,3.5,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(x+1,y,1.8,0,7);g.fill()}
function drawP(){const p=pl;if(p.inv>0&&((p.inv*20)|0)%2&&p.dash<=0)return;const cx=p.x+p.w/2;
g.strokeStyle='#e33';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(cx-p.face*5,p.y+8);p.sc.forEach(q=>g.lineTo(q.x,q.y));g.stroke();
g.save();g.translate(cx,p.y+p.h);const sy=1+(p.gr?0:Math.min(.16,Math.abs(p.vy)/4000));g.scale(p.face*(2-sy),sy);
const sw=p.gr&&Math.abs(p.vx)>20?Math.sin(p.t)*5:3;g.fillStyle='#1a2040';g.fillRect(-7+sw,-10,6,10);g.fillRect(1-sw,-10,6,10);
g.fillStyle='#2b3a67';g.fillRect(-9,-22,18,13);g.fillStyle='#1c2340';g.beginPath();g.arc(0,-24,8,0,7);g.fill();g.fillStyle='#f1d3b0';g.fillRect(-1,-27,9,5);g.fillStyle='#fff';g.fillRect(3,-26,4,2);g.fillStyle='#e33';g.fillRect(-8,-29,16,3);
g.strokeStyle='#cde';g.lineWidth=3;g.beginPath();g.moveTo(-6,-22);g.lineTo(-14,-34);g.stroke();g.restore();
const s=slash();if(s){const d=p.cmb==2?.34:.24,k=1-(p.atk-(d-.2))/.16,r=p.cmb==2?52:38,a0=-1.3,a1=-1.3+2.6*Math.min(1,k);g.strokeStyle=p.cmb==2?'#ffd36b':'#9ff';g.globalAlpha=Math.max(0,1-k*.7);g.lineWidth=p.cmb==2?14:9;g.beginPath();g.arc(cx,p.y+16,r,p.face>0?a0:Math.PI-a1,p.face>0?a1:Math.PI-a0);g.stroke();g.globalAlpha=1}}
function hud(){g.textAlign='left';g.font='700 22px '+F;for(let i=0;i<5;i++){g.fillStyle=i<pl.hp?'#f45':'rgba(255,255,255,.2)';g.fillText('♥',14+i*24,34)}
g.font='700 15px '+F;g.fillStyle='#fff';g.fillText('× '+lives+'  ◎ '+coins,14,56);g.textAlign='right';g.fillText('SCORE '+score,W-14,28);g.fillStyle='#bcd';g.fillText('BEST '+best,W-14,48);
g.textAlign='center';if(banner>0){g.globalAlpha=Math.min(1,banner);g.fillStyle='#fff';g.font='900 40px '+F;g.fillText('STAGE '+(st+1),W/2,150);g.font='700 22px '+F;g.fillText(TH[st].n,W/2,184);g.globalAlpha=1}
if(msg.l>0){g.globalAlpha=Math.min(1,msg.l);g.fillStyle='#ffd36b';g.font='900 30px '+F;g.fillText(msg.t,W/2,110);g.globalAlpha=1}
const b=bossOn&&E.find(e=>e.t=='boss');if(b){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(W/2-160,H-34,320,14);g.fillStyle='#e33';g.fillRect(W/2-158,H-32,316*Math.max(0,b.hp/b.m),10);g.fillStyle='#fff';g.font='700 12px '+F;g.fillText('BOSS',W/2,H-38)}
if(pl.dcd>0){g.fillStyle='rgba(120,200,255,.6)';g.fillRect(14,64,40*(1-pl.dcd/.6),3)}}
function box(a,l,c){g.fillStyle='rgba(5,8,20,.74)';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle=c||'#fff';g.font='900 54px '+F;g.fillText(a,W/2,140);g.font='600 18px '+F;l.forEach((s,i)=>{g.fillStyle=i==l.length-1?'rgba(255,211,107,'+(.6+.4*Math.sin(t*5))+')':'#dde';g.fillText(s,W/2,200+i*32)})}
function draw(){g.clearRect(0,0,W,H);
if(S=='title'){cam.x=t*50;bg()}else{bg();g.save();g.translate(Math.round(-cam.x+(shake?(Math.random()-.5)*shake:0)),shake?(Math.random()-.5)*shake|0:0);world();g.restore();hud()}
if(S=='title')box('SHADOW BLADE',['影の刃を振るい、三つの魔境を駆け抜けろ','← → / A D 移動　Z / Space ジャンプ（空中で2段）','X / J 斬撃（3連コンボ・弾き返し・踏みつけ）　C / L ダッシュ（無敵）','P ポーズ　　スマホは画面ボタンで操作','ENTER / タップ でスタート'],'#ffd36b');
else if(S=='pause')box('PAUSE',['P で再開']);
else if(S=='over')box('GAME OVER',['SCORE '+score+'　BEST '+best,'ENTER / タップ でリトライ'],'#f66');
else if(S=='clear')box('STAGE CLEAR!',['SCORE '+score+'　◎ '+coins,'タイムボーナス +'+bonus+'　残機ボーナス +'+lives*500,'ENTER / タップ で次のステージへ']);
else if(S=='win'){const r=score>=40000?'S':score>=28000?'A':score>=18000?'B':'C';box('ALL CLEAR!',['魔境は静寂を取り戻した…','SCORE '+score+'　RANK '+r+'　BEST '+best,'ENTER / タップ でタイトルへ'],'#ffd36b')}}
let last=0;function loop(ts){const dt=Math.min((ts-last)/1000||.016,1/30);last=ts;t+=dt;update(dt);draw();for(const k in P)P[k]=0;requestAnimationFrame(loop)}
build();initP();requestAnimationFrame(loop);
</script></body></html>
